name: CI - VIGOR

on:
  push:
    branches:
      - 'feat/**'
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    name: Compilar, testar e verificar cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vigor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vigor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes, relatório e quality gate
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publicar relatórios JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
