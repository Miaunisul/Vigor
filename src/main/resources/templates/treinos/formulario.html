<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar treino | VIGOR</title>
    <link rel="stylesheet" th:href="@{/css/membros.css}">
</head>
<body>
    <header class="site-header">
        <a class="brand" th:href="@{/membros}">VIGOR</a>
        <span>Sistema de gestão de academia</span>
        <nav class="site-nav" aria-label="Navegação principal">
            <a th:href="@{/treinos}">Treinos</a>
            <a th:href="@{/membros}">Membros</a>
        </nav>
    </header>

    <main class="page-shell">
        <a class="back-link" th:href="@{/treinos}">← Voltar para treinos</a>

        <section class="page-heading">
            <p class="eyebrow">Gestão de treinos</p>
            <h1>Cadastrar treino</h1>
            <p>Associe o treino a um membro e informe seus dados.</p>
        </section>

        <p class="feedback feedback--success" role="status" th:if="${sucesso}" th:text="${sucesso}"></p>
        <p class="feedback feedback--error" role="alert" th:if="${erro}" th:text="${erro}"></p>

        <section class="panel">
            <form th:action="@{/treinos}" th:object="${treino}" method="post" novalidate>
                <p class="feedback feedback--error" role="alert" th:if="${#lists.isEmpty(membros)}">
                    Cadastre um membro antes de registrar um treino.
                    <a th:href="@{/membros/novo}">Cadastrar membro</a>
                </p>

                <div class="form-grid">
                    <div class="form-field form-field--wide">
                        <label for="membroId">Membro</label>
                        <select id="membroId" name="membroId" required
                                th:classappend="${#fields.hasErrors('membro.id')} ? 'field-input--invalid' : ''"
                                th:attr="aria-invalid=${#fields.hasErrors('membro.id')}">
                            <option value="">Selecione um membro</option>
                            <option th:each="membro : ${membros}"
                                    th:value="${membro.id}"
                                    th:text="${membro.nome}"
                                    th:selected="${membroIdSelecionado != null and membro.id.toString() == membroIdSelecionado}">
                                Membro cadastrado
                            </option>
                        </select>
                        <small class="field-error" role="alert" th:if="${#fields.hasErrors('membro.id')}"
                               th:errors="*{membro.id}"></small>
                    </div>

                    <div class="form-field">
                        <label for="tipo">Tipo do treino</label>
                        <input id="tipo" type="text" th:field="*{tipo}" required
                               th:classappend="${#fields.hasErrors('tipo')} ? 'field-input--invalid' : ''"
                               th:attr="aria-invalid=${#fields.hasErrors('tipo')}">
                        <small class="field-error" role="alert" th:if="${#fields.hasErrors('tipo')}"
                               th:errors="*{tipo}"></small>
                    </div>

                    <div class="form-field">
                        <label for="duracaoMinutos">Duração (minutos)</label>
                        <input id="duracaoMinutos" type="number" min="1" step="1"
                               th:field="*{duracaoMinutos}" required
                               th:classappend="${#fields.hasErrors('duracaoMinutos')} ? 'field-input--invalid' : ''"
                               th:attr="aria-invalid=${#fields.hasErrors('duracaoMinutos')}">
                        <small class="field-error" role="alert" th:if="${#fields.hasErrors('duracaoMinutos')}"
                               th:errors="*{duracaoMinutos}"></small>
                    </div>

                    <div class="form-field">
                        <label for="dataInicio">Data de início</label>
                        <input id="dataInicio" type="date" th:field="*{dataInicio}" required
                               th:classappend="${#fields.hasErrors('dataInicio')} ? 'field-input--invalid' : ''"
                               th:attr="aria-invalid=${#fields.hasErrors('dataInicio')}">
                        <small class="field-error" role="alert" th:if="${#fields.hasErrors('dataInicio')}"
                               th:errors="*{dataInicio}"></small>
                    </div>

                    <div class="form-field form-field--wide">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" rows="4" th:field="*{descricao}" required
                                  th:classappend="${#fields.hasErrors('descricao')} ? 'field-input--invalid' : ''"
                                  th:attr="aria-invalid=${#fields.hasErrors('descricao')}"></textarea>
                        <small class="field-error" role="alert" th:if="${#fields.hasErrors('descricao')}"
                               th:errors="*{descricao}"></small>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="button button--primary" type="submit"
                            th:disabled="${#lists.isEmpty(membros)}">Cadastrar treino</button>
                    <a class="button button--secondary" th:href="@{/treinos}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
